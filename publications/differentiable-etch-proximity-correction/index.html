    "caption": "(a) Etch proximity correction pre-distorts the design layout so that the pattern left after lithography and etching matches the design. (b) Conventional correction iterates a model with heuristic feedback; ours back-propagates through a learned, differentiable model to correct the layout directly."

  "tldr": "A differentiable, transformer-based framework that corrects semiconductor layouts for etch effects end to end.",
  "abstract": "We introduce a novel deep learning framework for etch proximity correction (EPC), termed differentiable EPC (DEPC), which enables end-to-end optimization of after-etch patterning prediction and subsequent semiconductor layout correction. Unlike conventional EPC methods that rely on local corrections, this approach enables collective pattern optimization. The framework utilizes a transformer architecture incorporating relative coordinate encoding and masked attention to process layout data represented as polygons, thereby eliminating the prediction model’s patch dependency to scales well below the database-unit level. Additionally, we propose an inverse differentiable correction algorithm that enables convergence of targeting-off values within a database-unit level threshold across the entire chip layout. Using synthetic data generated to represent real-world semiconductor fabrication scenarios, we evaluated the performance of our proposed method and found that it reduces prediction error by 6.6% compared to hybrid ML model-based EPC and lowers revision verification scenario error by 6.5%, while maintaining accuracy close to the stochastic noise limit. The embedded‑space inclusion analysis indicates the usefulness of perturbative training samples within design‑rule bounds, enabling coverage of the corrected‑layout embedded space. By reducing variability in critical dimensions and improving targeting accuracy, this approach contributes to improved process margins and manufacturability in semiconductor fabrication."
};
