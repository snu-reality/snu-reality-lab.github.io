  "tldr": "Supervising holograms with the mutual intensity of light, a single objective that unifies focal-stack and light-field supervision.",
  "abstract": "Computer-generated holography (CGH) synthesizes interference patterns that reconstruct three-dimensional scenes through wave propagation. Modern optimization methods supervise holograms using image-based representations such as focal stacks or light fields, which capture only partial information about the optical field through a limited number of views and do not directly model the spatial correlations that govern interference. Under practical measurement budgets, these supervision signals leave the underlying wavefield underconstrained, allowing many distinct solutions to produce identical observations. In this work, we introduce mutual intensity factorization, a computational paradigm that reconstructs partially coherent wavefronts by optimizing the mutual intensity of time-multiplexed holograms through a compact low-rank mode representation. Mutual intensity characterizes spatial coherence by measuring correlations between complex wavefront amplitudes at pairs of points in space. However, directly optimizing mutual intensity is computationally prohibitive because the full matrix scales quadratically with the number of pixels. Thus, we incorporate a stochastic, block-wise approach to factorization, which reduces ambiguity in the inverse problem and provides a unified objective that subsumes existing image-based supervision methods. Through a phase-space interpretation based on the Wigner distribution, we show that focal stack and light field supervision signals can be derived from the underlying mutual intensity, establishing a unified theoretical perspective. Experimental results demonstrate stable reconstruction performance and illustrate how mutual intensity optimization generalizes across multiple supervision regimes.",
